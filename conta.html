<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#11120f" />
  <title>Minha conta | Lexus Elétricos</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="account-page" data-page="account">
  <header class="compact-header shell">
    <a class="brand" href="/"><span class="brand-icon">L</span><span class="brand-copy"><strong>Lexus</strong><small>Elétricos</small></span></a>
    <a class="text-link" href="/">Voltar à loja</a>
  </header>

  <main class="account-main shell">
    <section class="account-profile">
      <span class="kicker">MINHA CONTA</span>
      <div class="profile-avatar" id="profile-avatar">L</div>
      <h1 id="profile-name">Carregando...</h1>
      <p id="profile-email">—</p>
      <button class="btn btn-light" id="logout-button" type="button">Sair da conta</button>
    </section>

    <section class="orders-panel">
      <div class="section-heading small"><div><span class="kicker">HISTÓRICO</span><h2>Meus pedidos</h2></div></div>
      <div id="orders-list" class="orders-list"><div class="loading-card">Carregando pedidos...</div></div>
    </section>
  </main>
  <script src="/assets/account.js" defer></script>
</body>
</html>
